<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agreement metrics</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #eceff3;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      font-family: Inter, system-ui, sans-serif;
    }
    .board {
      width: min(880px, 100%);
      aspect-ratio: 5 / 3;
      background: #f3f5f8;
    }
    svg { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div class="board">
    <svg viewBox="0 0 880 528" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
          <path d="M0 0 L9 3.5 L0 7 Z" fill="#132033"/>
        </marker>
        <g id="laptop">
          <!-- screen -->
          <rect x="-46" y="-34" width="92" height="58" rx="4" fill="#132033" stroke="#132033" stroke-width="2"/>
          <!-- green widgets -->
          <rect x="-34" y="-22" width="22" height="16" rx="2" fill="none" stroke="#1fc49a" stroke-width="1.8"/>
          <rect x="-6" y="-22" width="22" height="16" rx="2" fill="none" stroke="#1fc49a" stroke-width="1.8"/>
          <rect x="-34" y="-2" width="22" height="16" rx="2" fill="none" stroke="#1fc49a" stroke-width="1.8"/>
          <rect x="-6" y="-2" width="22" height="16" rx="2" fill="none" stroke="#1fc49a" stroke-width="1.8"/>
          <circle cx="-23" cy="-14" r="2.5" fill="#1fc49a"/>
          <circle cx="5" cy="-14" r="2.5" fill="#1fc49a"/>
          <circle cx="-23" cy="6" r="2.5" fill="#1fc49a"/>
          <circle cx="5" cy="6" r="2.5" fill="#1fc49a"/>
          <!-- base -->
          <rect x="-56" y="26" width="112" height="10" rx="4" fill="#9eb6d4" stroke="#132033" stroke-width="2"/>
        </g>
      </defs>

      <rect width="880" height="528" fill="#f3f5f8"/>
      <text x="48" y="56" font-family="Inter,sans-serif" font-size="28" font-weight="700" fill="#132033">Agreement</text>

      <!-- Single source: labels / judge run -->
      <g transform="translate(440 150)">
        <use href="#laptop"/>
      </g>
      <text x="440" y="210" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="600" fill="#132033">Same labelled set</text>

      <!-- Fork -->
      <line x1="440" y1="230" x2="440" y2="290" stroke="#132033" stroke-width="2.5"/>
      <line x1="220" y1="290" x2="660" y2="290" stroke="#132033" stroke-width="2.5"/>
      <line x1="220" y1="290" x2="220" y2="330" stroke="#132033" stroke-width="2.5" marker-end="url(#a)"/>
      <line x1="660" y1="290" x2="660" y2="330" stroke="#132033" stroke-width="2.5" marker-end="url(#a)"/>

      <!-- Left number — muted, no card chrome -->
      <text x="220" y="400" text-anchor="middle" font-family="Inter,sans-serif" font-size="72" font-weight="700" fill="#b7c0cc">0.91</text>
      <line x1="150" y1="372" x2="290" y2="372" stroke="#132033" stroke-width="2.5"/>
      <text x="220" y="430" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="600" fill="#132033">Raw agreement</text>
      <text x="220" y="450" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="#4a5a6d">exact match</text>

      <!-- Right number — ink, no card -->
      <text x="660" y="400" text-anchor="middle" font-family="Inter,sans-serif" font-size="72" font-weight="700" fill="#132033">0.67</text>
      <text x="660" y="430" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="600" fill="#132033">Cohen’s κ</text>
      <text x="660" y="450" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="#4a5a6d">chance-corrected</text>

      <!-- Small mint accent mark on the real metric only -->
      <circle cx="720" cy="348" r="6" fill="#1fc49a" stroke="#132033" stroke-width="2"/>
    </svg>
  </div>
</body>
</html>
