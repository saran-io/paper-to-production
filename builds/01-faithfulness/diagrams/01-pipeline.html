<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faithfulness evaluation — Weaviate-exact layout</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #dfe3e8;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      font-family: Inter, system-ui, sans-serif;
    }
    .board {
      width: min(1100px, 100%);
      background: #f2f4f7;
      border-radius: 4px;
      box-shadow: 0 1px 0 rgba(11,20,38,0.06);
    }
    svg { width: 100%; height: auto; display: block; }
    .meta {
      max-width: 1100px;
      width: 100%;
      margin-top: 0.85rem;
      font-size: 0.8rem;
      color: #5a6a7c;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <!--
    Layout cloned from Weaviate RAG blog diagram:
    center dashed local box · left DB · right hex LLM · 4 numbered green icon steps.
    Labels remapped to faithfulness evaluation.
  -->
  <div class="board">
    <svg viewBox="0 0 1100 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Faithfulness evaluation flow matching Weaviate RAG diagram layout">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#14233a"/>
        </marker>

        <!-- Green step icon disc -->
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="0.5" stdDeviation="0.4" flood-color="#14233a" flood-opacity="0.08"/>
        </filter>
      </defs>

      <rect width="1100" height="620" fill="#f2f4f7"/>

      <!-- ===================== LEFT: Retrieved context (DB) ===================== -->
      <g transform="translate(165 310)">
        <!-- stacked cylinders — Weaviate style -->
        <ellipse cx="0" cy="-52" rx="52" ry="16" fill="#ffffff" stroke="#14233a" stroke-width="2.5"/>
        <path d="M-52 -52 V-18 c0 10 23 16 52 16 s52 -6 52 -16 V-52" fill="#ffffff" stroke="#14233a" stroke-width="2.5"/>
        <ellipse cx="0" cy="-18" rx="52" ry="16" fill="#ffffff" stroke="#14233a" stroke-width="2.5"/>
        <path d="M-52 -18 V16 c0 10 23 16 52 16 s52 -6 52 -16 V-18" fill="#ffffff" stroke="#14233a" stroke-width="2.5"/>
        <ellipse cx="0" cy="16" rx="52" ry="16" fill="#ffffff" stroke="#14233a" stroke-width="2.5"/>
        <path d="M-52 16 V50 c0 10 23 16 52 16 s52 -6 52 -16 V16" fill="#ffffff" stroke="#14233a" stroke-width="2.5"/>
        <ellipse cx="0" cy="50" rx="52" ry="16" fill="#ffffff" stroke="#14233a" stroke-width="2.5"/>
        <!-- data dots on bands -->
        <g fill="#14233a">
          <circle cx="-14" cy="-18" r="2.2"/><circle cx="0" cy="-18" r="2.2" fill="#1ed9a3"/><circle cx="14" cy="-18" r="2.2"/>
          <circle cx="-14" cy="16" r="2.2"/><circle cx="0" cy="16" r="2.2"/><circle cx="14" cy="16" r="2.2" fill="#1ed9a3"/>
          <circle cx="-14" cy="50" r="2.2" fill="#1ed9a3"/><circle cx="0" cy="50" r="2.2"/><circle cx="14" cy="50" r="2.2"/>
        </g>
        <!-- hex badge top-left -->
        <g transform="translate(-48 -58)">
          <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="#14233a"/>
          <!-- p2p mark (not Weaviate w) — small check -->
          <path d="M-5 0 l4 4 8 -9" fill="none" stroke="#1ed9a3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
      <text x="50" y="318" font-family="Inter,sans-serif" font-size="18" font-weight="600" fill="#14233a">Retrieved</text>
      <text x="50" y="342" font-family="Inter,sans-serif" font-size="18" font-weight="600" fill="#14233a">context</text>

      <!-- ===================== RIGHT: Judge LLM (hex + net) ===================== -->
      <g transform="translate(935 310)">
        <polygon points="0,-78 68,-39 68,39 0,78 -68,39 -68,-39" fill="#ffffff" stroke="#14233a" stroke-width="2.8"/>
        <!-- neural net nodes -->
        <g stroke="#14233a" stroke-width="1.6" fill="none">
          <line x1="-28" y1="-28" x2="-6" y2="-8"/>
          <line x1="-28" y1="-28" x2="-8" y2="18"/>
          <line x1="8" y1="-30" x2="-6" y2="-8"/>
          <line x1="8" y1="-30" x2="22" y2="6"/>
          <line x1="-6" y1="-8" x2="22" y2="6"/>
          <line x1="-6" y1="-8" x2="-8" y2="18"/>
          <line x1="-8" y1="18" x2="18" y2="28"/>
          <line x1="22" y1="6" x2="18" y2="28"/>
          <line x1="8" y1="-30" x2="32" y2="-12"/>
          <line x1="32" y1="-12" x2="22" y2="6"/>
        </g>
        <circle cx="-28" cy="-28" r="7" fill="#9ec9f0" stroke="#14233a" stroke-width="1.5"/>
        <circle cx="8" cy="-30" r="7" fill="#1ed9a3" stroke="#14233a" stroke-width="1.5"/>
        <circle cx="32" cy="-12" r="6" fill="#c5ccd6" stroke="#14233a" stroke-width="1.5"/>
        <circle cx="-6" cy="-8" r="7" fill="#ffffff" stroke="#14233a" stroke-width="1.5"/>
        <circle cx="22" cy="6" r="7" fill="#9ec9f0" stroke="#14233a" stroke-width="1.5"/>
        <circle cx="-8" cy="18" r="7" fill="#1ed9a3" stroke="#14233a" stroke-width="1.5"/>
        <circle cx="18" cy="28" r="6" fill="#c5ccd6" stroke="#14233a" stroke-width="1.5"/>
      </g>
      <text x="1020" y="318" font-family="Inter,sans-serif" font-size="18" font-weight="600" fill="#14233a">Judge</text>
      <text x="1020" y="342" font-family="Inter,sans-serif" font-size="18" font-weight="600" fill="#14233a">LLM</text>

      <!-- ===================== CENTER: local evaluator ===================== -->
      <rect x="430" y="210" width="240" height="200" rx="10" fill="#e8ecf1" stroke="#1ed9a3" stroke-width="2.5" stroke-dasharray="6 5"/>

      <!-- person at laptop (side/3q view simplified) -->
      <g transform="translate(550 320)">
        <!-- chair hint -->
        <path d="M-70 48 h36" stroke="#14233a" stroke-width="2.5" stroke-linecap="round"/>
        <!-- torso -->
        <path d="M-52 48 c-2 -28 8 -40 22 -42" fill="none" stroke="#14233a" stroke-width="2.5" stroke-linecap="round"/>
        <!-- head -->
        <circle cx="-28" cy="-10" r="16" fill="#d7dde6" stroke="#14233a" stroke-width="2.2"/>
        <!-- hair / hood green -->
        <path d="M-42 -14 c0 -16 10 -26 22 -24 c8 1 14 10 14 20 c-8 -2 -16 0 -24 6 c-4 2 -8 2 -12 -2z" fill="#1ed9a3" stroke="#14233a" stroke-width="1.8"/>
        <!-- arm to laptop -->
        <path d="M-34 14 C-10 22 10 18 28 8" fill="none" stroke="#14233a" stroke-width="2.5" stroke-linecap="round"/>
        <!-- laptop base -->
        <rect x="8" y="28" width="78" height="9" rx="3" fill="#d7dde6" stroke="#14233a" stroke-width="2"/>
        <!-- laptop screen -->
        <path d="M14 28 L22 -8 h62 l-6 36 H14 z" fill="#14233a" stroke="#14233a" stroke-width="2"/>
        <!-- logo on lid -->
        <circle cx="50" cy="10" r="7" fill="#ffffff"/>
        <path d="M46 10 l3 3 6 -7" fill="none" stroke="#1ed9a3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- ===================== ARROWS (orthogonal, rounded) ===================== -->
      <!-- 1: center top → left DB top -->
      <path d="M 480 210 L 480 150 Q 480 130 460 130 L 230 130 Q 210 130 210 150 L 210 230"
            fill="none" stroke="#14233a" stroke-width="2.4" marker-end="url(#arr)"/>

      <!-- 2: left DB bottom → center bottom -->
      <path d="M 210 390 L 210 470 Q 210 490 230 490 L 460 490 Q 480 490 480 470 L 480 410"
            fill="none" stroke="#14233a" stroke-width="2.4" marker-end="url(#arr)"/>

      <!-- 3: center top → right LLM top -->
      <path d="M 620 210 L 620 150 Q 620 130 640 130 L 890 130 Q 910 130 910 150 L 910 230"
            fill="none" stroke="#14233a" stroke-width="2.4" marker-end="url(#arr)"/>

      <!-- 4: right LLM bottom → center bottom -->
      <path d="M 910 390 L 910 470 Q 910 490 890 490 L 640 490 Q 620 490 620 470 L 620 410"
            fill="none" stroke="#14233a" stroke-width="2.4" marker-end="url(#arr)"/>

      <!-- ===================== STEP PILLS ===================== -->
      <!-- helper: green disc + navy number + label -->

      <!-- Step 1 -->
      <g transform="translate(300 130)">
        <circle cx="0" cy="0" r="26" fill="#b7f5d8"/>
        <!-- magnifying glass -->
        <circle cx="-2" cy="-2" r="9" fill="none" stroke="#14233a" stroke-width="2.4"/>
        <line x1="5" y1="5" x2="12" y2="12" stroke="#14233a" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="-28" cy="0" r="12" fill="#14233a"/>
        <text x="-28" y="5" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#ffffff">1</text>
        <text x="40" y="5" font-family="Inter,sans-serif" font-size="16" font-weight="600" fill="#14233a">Send answer</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(300 490)">
        <circle cx="0" cy="0" r="26" fill="#b7f5d8"/>
        <!-- document -->
        <rect x="-10" y="-12" width="18" height="24" rx="2" fill="#ffffff" stroke="#14233a" stroke-width="2"/>
        <line x1="-5" y1="-5" x2="5" y2="-5" stroke="#14233a" stroke-width="1.8"/>
        <line x1="-5" y1="1" x2="5" y2="1" stroke="#14233a" stroke-width="1.8"/>
        <line x1="-5" y1="7" x2="2" y2="7" stroke="#14233a" stroke-width="1.8"/>
        <rect x="2" y="4" width="7" height="7" fill="#1ed9a3" stroke="#14233a" stroke-width="1.2"/>
        <circle cx="-28" cy="0" r="12" fill="#14233a"/>
        <text x="-28" y="5" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#ffffff">2</text>
        <text x="40" y="5" font-family="Inter,sans-serif" font-size="16" font-weight="600" fill="#14233a">Attach context</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(740 130)">
        <circle cx="0" cy="0" r="26" fill="#b7f5d8"/>
        <!-- code brackets -->
        <text x="0" y="7" text-anchor="middle" font-family="Inter,sans-serif" font-size="20" font-weight="700" fill="#14233a">&lt;·&gt;</text>
        <circle cx="-28" cy="0" r="12" fill="#14233a"/>
        <text x="-28" y="5" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#ffffff">3</text>
        <text x="40" y="5" font-family="Inter,sans-serif" font-size="16" font-weight="600" fill="#14233a">Decompose + verify</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(740 490)">
        <circle cx="0" cy="0" r="26" fill="#b7f5d8"/>
        <!-- speech bubble -->
        <path d="M-12 -8 h22 a8 8 0 0 1 8 8 v8 a8 8 0 0 1 -8 8 h-10 l-8 7 v-7 h-4 a8 8 0 0 1 -8 -8 v-8 a8 8 0 0 1 8 -8 z"
              fill="#ffffff" stroke="#14233a" stroke-width="2"/>
        <line x1="-6" y1="0" x2="8" y2="0" stroke="#14233a" stroke-width="1.8"/>
        <circle cx="4" cy="7" r="2.2" fill="#1ed9a3" stroke="#14233a" stroke-width="1"/>
        <circle cx="-28" cy="0" r="12" fill="#14233a"/>
        <text x="-28" y="5" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#ffffff">4</text>
        <text x="40" y="5" font-family="Inter,sans-serif" font-size="16" font-weight="600" fill="#14233a">Faithfulness score</text>
      </g>
    </svg>
  </div>
  <div class="meta">
    <span>Same shell as Weaviate RAG diagram · faithfulness labels</span>
    <span>Screenshot the board only · Sprint 01</span>
  </div>
</body>
</html>
