<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>X banner — fluent answers can still be unsupported</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{ margin:0; padding:0; overflow:hidden; background:#f4f6f4; }
  svg{ display:block; width:100vw; height:100vh; }
</style>
</head>
<body>
<!-- Export at 1600 x 900 (X / Twitter in-feed 16:9) -->
<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Fluent answers can still be unsupported. A pipeline splits an answer into five single facts, checks them against the retrieved documents, and blocks the two that have no source.">
  <defs>
    <pattern id="hx" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="rgba(208,52,44,0.45)" stroke-width="2"/>
    </pattern>
    <pattern id="mesh" width="10" height="10" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="rgba(31,111,208,0.45)" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#f4f6f4"/>

  <!-- ================= headline ================= -->
  <g font-family="Montserrat,sans-serif" font-weight="700" font-size="68" fill="#333333"
     letter-spacing="-0.02em">
    <text x="88" y="176">Fluent answers can still</text>
    <text x="88" y="252">be unsupported.</text>
  </g>
  <text x="88" y="312" font-family="Lexend,sans-serif" font-weight="300" font-size="26" fill="#666666">
    Split it into single facts. Then block whatever the documents don't back.
  </text>

  <!-- micro-signature, top right -->
  <circle cx="1341" cy="106" r="6" fill="#0f9d48"/>
  <text x="1512" y="114" font-family="Montserrat,sans-serif" font-weight="600" font-size="20"
        fill="#949494" text-anchor="end" letter-spacing="0.16em">saran.build</text>

  <!-- ================= the documents ================= -->
  <text x="930" y="396" font-family="Montserrat,sans-serif" font-weight="600" font-size="22"
        fill="#4a4a4a" text-anchor="middle" letter-spacing="0.13em">THE DOCUMENTS</text>
  <g fill="#f4f6f4" stroke="rgba(51,51,51,0.55)" stroke-width="2">
    <rect x="898" y="414" width="96" height="52"/>
    <rect x="890" y="426" width="96" height="52"/>
    <rect x="882" y="438" width="96" height="52"/>
  </g>
  <g stroke="rgba(51,51,51,0.40)" stroke-width="2">
    <line x1="898" y1="462" x2="962" y2="462"/>
    <line x1="898" y1="474" x2="946" y2="474"/>
  </g>
  <line x1="930" y1="490" x2="930" y2="518" stroke="#555555" stroke-width="2" stroke-dasharray="10,7"/>

  <!-- ================= the line ================= -->
  <rect x="88" y="542" width="812" height="168" fill="rgba(51,51,51,0.09)"/>

  <!-- what got through -->
  <g fill="rgba(15,157,72,0.30)">
    <rect x="966" y="542" width="474" height="24"/>
    <rect x="966" y="614" width="474" height="24"/>
    <rect x="966" y="686" width="474" height="24"/>
  </g>
  <!-- what was blocked -->
  <g fill="url(#hx)">
    <rect x="966" y="578" width="474" height="24"/>
    <rect x="966" y="650" width="474" height="24"/>
  </g>

  <!-- the split into five channels -->
  <g fill="#f4f6f4" stroke="rgba(51,51,51,0.55)" stroke-width="2">
    <path d="M500,572 L600,566 L1440,566 L1440,578 L600,578 Z"/>
    <path d="M500,608 L600,602 L1440,602 L1440,614 L600,614 Z"/>
    <path d="M500,644 L600,638 L1440,638 L1440,650 L600,650 Z"/>
    <path d="M500,680 L600,674 L1440,674 L1440,686 L600,686 Z"/>
  </g>

  <!-- pipe walls + flanges -->
  <g stroke="#333333" stroke-width="3" fill="none">
    <line x1="88" y1="542" x2="1440" y2="542"/>
    <line x1="88" y1="710" x2="1440" y2="710"/>
  </g>
  <g fill="rgba(51,51,51,0.14)" stroke="#333333" stroke-width="2">
    <rect x="78" y="526" width="10" height="200"/>
    <rect x="1440" y="526" width="10" height="200"/>
  </g>

  <!-- the check against the documents -->
  <rect x="900" y="518" width="60" height="216" fill="url(#mesh)"/>
  <rect x="900" y="518" width="60" height="216" fill="none" stroke="#1f6fd0" stroke-width="3"/>
  <g fill="#d0342c">
    <rect x="960" y="578" width="14" height="24"/>
    <rect x="960" y="650" width="14" height="24"/>
  </g>

  <!-- ================= captions under the line ================= -->
  <g font-family="Montserrat,sans-serif" font-weight="600" font-size="22"
     fill="#4a4a4a" text-anchor="middle" letter-spacing="0.13em">
    <text x="620" y="782">SPLIT INTO SINGLE FACTS</text>
    <text x="1200" y="782">3 BACKED &#183; 2 BLOCKED</text>
  </g>
</svg>
</body>
</html>
