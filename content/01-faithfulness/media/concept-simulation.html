<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Faithfulness as a concept simulation</title>
  <style>
    :root {
      --bg: #FCFCF8;
      --ink: #2F3133;
      --muted: #6F7377;
      --accent: #B7C97B;
      --tone: #2EB7F3;
      --toneBg: #E8F5FE;
      --noteBorder: #8AD8FB;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Aptos, "Helvetica Neue", Arial, sans-serif; background: radial-gradient(circle at top left, #fff 0%, var(--bg) 58%); color: var(--ink); }
    .shell { max-width: 1280px; margin: 0 auto; padding: 56px 40px 72px; }
    .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
    h1 { margin: 0; font-size: clamp(40px, 5vw, 72px); line-height: 0.95; max-width: 980px; }
    .subtitle { margin-top: 16px; color: var(--muted); font-size: clamp(18px, 2vw, 24px); max-width: 760px; }
    .panel { margin-top: 36px; display: grid; grid-template-columns: minmax(280px, 360px) 1fr; gap: 28px; align-items: center; }
    .step-meta { color: var(--muted); font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    .tone-pill { display: inline-flex; align-items: center; gap: 10px; margin-top: 14px; padding: 8px 14px; border-radius: 999px; background: var(--toneBg); color: var(--ink); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    .tone-pill::before { content: ""; width: 10px; height: 10px; border-radius: 999px; background: var(--tone); }
    .headline { margin-top: 10px; font-size: clamp(28px, 3vw, 42px); line-height: 1.02; }
    .caption { margin-top: 14px; font-size: 18px; line-height: 1.45; }
    .note { margin-top: 18px; padding: 14px 16px; border-radius: 18px; background: var(--toneBg); border: 1px solid var(--noteBorder); color: var(--ink); font-size: 15px; line-height: 1.4; }
    .takeaway { margin-top: 18px; padding: 14px 18px; border: 1px solid #d7d9d2; border-radius: 16px; color: var(--muted); font-size: 15px; background: rgba(255,255,255,0.72); }
    .viewer { min-height: 520px; display: grid; place-items: center; background: linear-gradient(180deg, rgba(255,255,255,0.62), rgba(255,255,255,0.22)); border: 1px solid #ecece6; border-radius: 32px; box-shadow: 0 30px 70px rgba(40,40,30,0.05); overflow: hidden; }
    .viewer svg { width: 100%; height: auto; display: block; }
    .controls { margin-top: 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: center; }
    .buttons { display: flex; gap: 10px; }
    button { border: 1px solid #d7d9d2; border-radius: 999px; background: white; color: var(--ink); padding: 12px 18px; font-size: 15px; font-weight: 600; cursor: pointer; }
    button[disabled] { opacity: 0.4; cursor: default; }
    .dots { display: flex; gap: 10px; flex-wrap: wrap; }
    .dot { width: 13px; height: 13px; border-radius: 999px; border: 1px solid #d0d2cb; background: white; cursor: pointer; padding: 0; }
    .dot.active { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 6px rgba(0,0,0,0.03); }
    @media (max-width: 920px) { .shell { padding: 32px 20px 48px; } .panel { grid-template-columns: 1fr; } .viewer { min-height: 360px; } }
  </style>
</head>
<body>
  <main class="shell">
    <div class="eyebrow">Concept Simulation</div>
    <h1>Faithfulness as a concept simulation</h1>
    <div class="subtitle">A clearer explanation of how a fluent answer becomes a grounded evaluation signal.</div>

      <div class="copy">

        <div id="tonePill" class="tone-pill"></div>
        <div id="headline" class="headline"></div>
        <div id="caption" class="caption"></div>
        <div id="note" class="note"></div>
        <div id="takeaway" class="takeaway"></div>
      </div>
      <div class="viewer"><div id="sceneRoot"></div></div>
    </section>
    <div class="controls">
      <div class="buttons">
        <button id="prevBtn" type="button">Previous</button>
        <button id="nextBtn" type="button">Next</button>
      </div>
      <div id="dots" class="dots"></div>
    </div>
  </main>

    const sceneRoot = document.getElementById('sceneRoot');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const dots = document.getElementById('dots');
    const toneStyles = {"context": {"accent": "#9DB8D6", "panel": "#F3F6F8", "note_bg": "#E8F0F8", "note_border": "#9DB8D6"}, "structure": {"accent": "#C8D0DA", "panel": "#F6F7F7", "note_bg": "#EEF1F4", "note_border": "#B9C2CC"}, "analysis": {"accent": "#2EB7F3", "panel": "#F2F8FC", "note_bg": "#E8F5FE", "note_border": "#8AD8FB"}, "result": {"accent": "#6DB59A", "panel": "#F4FAF7", "note_bg": "#EAF7F0", "note_border": "#99CFB9"}};
    let index = 0;
    function render() {
      const step = steps[index];
      const tone = step.section_tone || 'analysis';
      const style = toneStyles[tone] || toneStyles.analysis;
      document.documentElement.style.setProperty('--tone', style.accent);
      document.documentElement.style.setProperty('--toneBg', style.note_bg);
      document.documentElement.style.setProperty('--noteBorder', style.note_border);
      stepMeta.textContent = `${step.label} / ${steps.length}`;
      tonePill.textContent = tone;
      headline.textContent = step.headline;
      caption.textContent = step.caption;
      note.textContent = step.note || '';
      note.style.display = step.note ? 'block' : 'none';
      takeaway.textContent = step.takeaway || '';
      takeaway.style.display = step.takeaway ? 'block' : 'none';
      sceneRoot.innerHTML = scenes[step.id];
      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === steps.length - 1;
      Array.from(dots.children).forEach((node, nodeIndex) => node.classList.toggle('active', nodeIndex === index));
    }
    steps.forEach((step, stepIndex) => {
      const dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'dot';
      dot.setAttribute('aria-label', `Go to step ${step.label}`);
      dot.addEventListener('click', () => { index = stepIndex; render(); });
      dots.appendChild(dot);
    });
    prevBtn.addEventListener('click', () => { if (index > 0) { index -= 1; render(); } });
    nextBtn.addEventListener('click', () => { if (index < steps.length - 1) { index += 1; render(); } });
    render();
  </script>
