[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-to-production"
version = "0.1.0"
description = "Implementing arXiv research in production voice and RAG systems — and measuring whether it actually works."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
llm = ["openai>=1.40"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
faithfulness = "faithfulness.cli:main"

[tool.setuptools.packages.find]
where = ["instruments/costmeter", "sprints/01-faithfulness/src"]
include = ["costmeter*", "faithfulness*"]

[tool.pytest.ini_options]
testpaths = ["sprints/01-faithfulness/tests"]
pythonpath = [
  "instruments/costmeter",
  "sprints/01-faithfulness/src",
]
